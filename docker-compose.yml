# path docker-compose.yml

# Base commune des services applicatifs (producers, sinks, API, dashboard)
# Lancés avec : docker compose --profile app up -d --build
# L'image partagée n'est construite que par binance-producer (évite les exports concurrents du même tag)
x-app: &app
  image: cryptoflow-app:latest
  env_file: [config/.env]
  environment: &app-env
    KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP:-broker-1:29092,broker-2:29093,broker-3:29094}
    TIMESCALE_HOST: timescaledb
    TIMESCALE_PORT: "5432"
    REDIS_HOST: redis
  restart: unless-stopped
  profiles: [app]

# Healthcheck des services sans port HTTP : le service touche /tmp/heartbeat dans sa boucle
x-heartbeat: &heartbeat
  test: ["CMD", "python", "-m", "common.heartbeat", "90"]
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 60s

services:

  # ─── Zookeeper ───────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: cryptoflow-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Kafka Broker 1 ──────────────────────────────────────────
  broker-1:
    image: confluentinc/cp-kafka:7.5.0
    container_name: cryptoflow-broker-1
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker-1:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - broker-1-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  # ─── Kafka Broker 2 ──────────────────────────────────────────
  broker-2:
    image: confluentinc/cp-kafka:7.5.0
    container_name: cryptoflow-broker-2
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker-2:29093,PLAINTEXT_HOST://localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - broker-2-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9093"]
      interval: 10s
      timeout: 10s
      retries: 5

  # ─── Kafka Broker 3 ──────────────────────────────────────────
  broker-3:
    image: confluentinc/cp-kafka:7.5.0
    container_name: cryptoflow-broker-3
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker-3:29094,PLAINTEXT_HOST://localhost:9094
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - broker-3-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9094"]
      interval: 10s
      timeout: 10s
      retries: 5

  # ─── Schema Registry ─────────────────────────────────────────
  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    container_name: cryptoflow-schema-registry
    depends_on:
      broker-1:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: broker-1:29092,broker-2:29093,broker-3:29094
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081

  # ─── Kafka UI (Control Center léger) ─────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: cryptoflow-kafka-ui
    depends_on:
      - broker-1
      - broker-2
      - broker-3
      - schema-registry
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: cryptoflow-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: broker-1:29092,broker-2:29093,broker-3:29094
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      DYNAMIC_CONFIG_ENABLED: "true"

  # ─── Init Kafka Topics ────────────────────────────────────────
  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: cryptoflow-kafka-init
    depends_on:
      broker-1:
        condition: service_healthy
      broker-2:
        condition: service_healthy
      broker-3:
        condition: service_healthy
    environment:
      MC_HOST_local: http://minioadmin:minioadmin@minio:9000
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      echo 'Waiting for Kafka to be ready...'
      sleep 15

      echo 'Creating topic: crypto.prices'
      kafka-topics --bootstrap-server broker-1:29092 --create --if-not-exists --topic crypto.prices --partitions 6 --replication-factor ${KAFKA_REPLICATION:-3} --config retention.ms=86400000


      echo 'Creating topic: crypto.history'
      kafka-topics --bootstrap-server broker-1:29092 --create --if-not-exists --topic crypto.history --partitions 3 --replication-factor ${KAFKA_REPLICATION:-3} --config retention.ms=604800000

      echo 'Creating topic: crypto.onchain'
      kafka-topics --bootstrap-server broker-1:29092 --create --if-not-exists --topic crypto.onchain --partitions 3 --replication-factor ${KAFKA_REPLICATION:-3} --config retention.ms=604800000

      echo 'Creating topic: crypto.indicators'
      kafka-topics --bootstrap-server broker-1:29092 --create --if-not-exists --topic crypto.indicators --partitions 6 --replication-factor ${KAFKA_REPLICATION:-3} --config retention.ms=604800000

      echo 'Topics created successfully!'
      kafka-topics --bootstrap-server broker-1:29092 --list
      "

  # ─── Apache Spark Master ──────────────────────────────────────
  spark-master:
    image: apache/spark:3.5.0-python3
    container_name: cryptoflow-spark-master
    user: root
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
      --host spark-master
      --port 7077
      --webui-port 8080
    environment:
      SPARK_NO_DAEMONIZE: "true"
    ports:
      - "8090:8080"   # Spark UI (8080 déjà pris par Kafka UI)
      - "7077:7077"   # Spark master port
    volumes:
      - ./spark:/opt/spark/jobs
      - spark-checkpoints:/tmp/cryptoflow
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 15s
      timeout: 10s
      retries: 5
 
  # ─── Apache Spark Worker ──────────────────────────────────────
  spark-worker:
    image: apache/spark:3.5.0-python3
    container_name: cryptoflow-spark-worker
    user: root
    depends_on:
      spark-master:
        condition: service_healthy
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      --webui-port 8081
      spark://spark-master:7077
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_MEMORY: "2g"
      SPARK_WORKER_CORES: "2"
    ports:
      - "8091:8081"   # Worker UI
    volumes:
      - ./spark:/opt/spark/jobs
      - spark-checkpoints:/tmp/cryptoflow
 
  # ─── Spark Submit (job runner) ────────────────────────────────
  # Utilisé pour soumettre le streaming job depuis Docker.
  # Lance le job puis s'arrête (restart: no).
  spark-submit:
    image: apache/spark:3.5.0-python3
    container_name: cryptoflow-spark-submit
    user: root
    depends_on:
      spark-master:
        condition: service_healthy
      broker-1:
        condition: service_healthy
    command: >
      /opt/spark/bin/spark-submit
      --master spark://spark-master:7077
      --executor-memory 512m
      --executor-cores 1
      --total-executor-cores 1
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0,org.apache.kafka:kafka-clients:3.5.0
      --py-files /opt/spark/jobs/indicators.py
      --conf spark.sql.shuffle.partitions=4
      --conf spark.streaming.stopGracefullyOnShutdown=true
      /opt/spark/jobs/streaming_job.py
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP:-broker-1:29092,broker-2:29093,broker-3:29094}
      TOPIC_PRICES: crypto.prices
      TOPIC_INDICATORS: crypto.indicators
      CHECKPOINT_DIR: /tmp/cryptoflow/checkpoints
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      MINIO_ENDPOINT: http://minio:9000
      DELTA_LAKE_PATH: s3a://cryptoflow
    volumes:
      - ./spark:/opt/spark/jobs
      - spark-checkpoints:/tmp/cryptoflow
      - ./config/.env:/opt/spark/jobs/config/.env
    restart: "no"
    profiles:
      - streaming   # lancé uniquement avec : docker compose --profile streaming up spark-submit
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: cryptoflow-minio
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console UI
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "MC_HOST_local=http://minioadmin:minioadmin@localhost:9000 mc ready local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: cgr.dev/chainguard/minio:latest
    container_name: cryptoflow-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://minioadmin:minioadmin@minio:9000
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      mc mb --ignore-existing local/cryptoflow
      mc mb --ignore-existing local/cryptoflow-checkpoints
      echo 'Buckets created.'
      "
    restart: "no"
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: cryptoflow-timescaledb
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: crypto
      POSTGRES_PASSWORD: crypto
      POSTGRES_DB: cryptoflow
      POSTGRES_HOST_AUTH_METHOD: md5
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
      - ./spark/init_timescale.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./spark/init_timescale_policies.sql:/docker-entrypoint-initdb.d/02_policies.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crypto -d cryptoflow"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    container_name: cryptoflow-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  spark-submit-delta:
    image: apache/spark:3.5.0-python3
    container_name: cryptoflow-spark-delta
    user: root
    depends_on:
      spark-master:
        condition: service_healthy
      broker-1:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: >
      /opt/spark/bin/spark-submit
      --master spark://spark-master:7077
      --executor-memory 512m
      --executor-cores 1
      --total-executor-cores 1
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0,org.apache.kafka:kafka-clients:3.5.0,io.delta:delta-spark_2.12:3.2.0,org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262
      --conf spark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension
      --conf spark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog
      --conf spark.sql.shuffle.partitions=4
      --conf spark.streaming.stopGracefullyOnShutdown=true
      /opt/spark/jobs/delta_sink_job.py
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP:-broker-1:29092,broker-2:29093,broker-3:29094}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      DELTA_LAKE_PATH: s3a://cryptoflow
      CHECKPOINT_DIR: /tmp/cryptoflow/checkpoints
    volumes:
      - ./spark:/opt/spark/jobs
      - spark-checkpoints:/tmp/cryptoflow
    restart: "no"
    profiles:
      - delta

  # ─── Services applicatifs (profil "app") ──────────────────────
  binance-producer:
    <<: *app
    build: { context: ., dockerfile: Dockerfile.app }
    container_name: cryptoflow-binance-producer
    command: python producers/binance_producer.py
    depends_on:
      kafka-init: { condition: service_completed_successfully }

  coingecko-producer:
    <<: *app
    container_name: cryptoflow-coingecko-producer
    command: python producers/coingecko_producer.py
    depends_on:
      kafka-init: { condition: service_completed_successfully }

  etherscan-producer:
    <<: *app
    container_name: cryptoflow-etherscan-producer
    command: python producers/etherscan_producer.py
    depends_on:
      kafka-init: { condition: service_completed_successfully }

  timescale-sink:
    <<: *app
    container_name: cryptoflow-timescale-sink
    command: python spark/timescale_sink.py
    healthcheck: *heartbeat
    depends_on:
      kafka-init:  { condition: service_completed_successfully }
      timescaledb: { condition: service_healthy }

  redis-sink:
    <<: *app
    container_name: cryptoflow-redis-sink
    command: python spark/redis_sink.py
    healthcheck: *heartbeat
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      redis:      { condition: service_healthy }

  alert-service:
    <<: *app
    container_name: cryptoflow-alert-service
    command: python -m alerts.service
    healthcheck: *heartbeat
    depends_on:
      kafka-init: { condition: service_completed_successfully }

  api:
    <<: *app
    container_name: cryptoflow-api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "8000:8000"
    depends_on:
      timescaledb: { condition: service_healthy }
      redis:       { condition: service_healthy }

  dashboard:
    <<: *app
    container_name: cryptoflow-dashboard
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      <<: *app-env
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api: { condition: service_healthy }

volumes:
  zookeeper-data:
  zookeeper-logs:
  broker-1-data:
  broker-2-data:
  broker-3-data:
  spark-checkpoints:
  minio-data:
  timescaledb-data:
  redis-data:

networks:
  default:
    name: cryptoflow-network