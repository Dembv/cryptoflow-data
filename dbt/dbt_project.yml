# path : dbt/dbt_project.yml

name: 'cryptoflow'
version: '1.0.0'
config-version: 2

profile: 'cryptoflow'

model-paths:  ["models"]
test-paths:   ["tests"]
macro-paths:  ["macros"]

target-path:  "target"
clean-targets: ["target", "dbt_packages"]

models:
  cryptoflow:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts
    gold:
      +materialized: table
      +schema: gold

vars:
  default_lookback_days: 30
  tracked_assets: ['BTC', 'ETH', 'SOL', 'BNB', 'XRP']
  min_trade_volume: 0.0001